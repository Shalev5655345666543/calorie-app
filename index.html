<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<title>מעקב קלוריות</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1da;--ac:#2f7d4f;--ac2:#e8f3ec;--cal:#e8833a;--pro:#3b7dd8;--car:#c9a227;--fat:#b5527a}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--card:#222220;--tx:#f0efe9;--mu:#a09f97;--bd:#383835;--ac:#58b97c;--ac2:#1f2e25;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s}
.row{display:flex;justify-content:space-between;font-size:14px}
button,label.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;display:inline-block;text-align:center}
button.sec{background:var(--ac2);color:var(--ac)}button.x{background:none;color:var(--mu);padding:4px 8px}button:disabled{opacity:.5}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid label{font-size:13px;color:var(--mu)}
img#pv{max-width:100%;max-height:240px;border-radius:10px;display:none;margin:10px auto 0}
.item,.meal{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}.item:first-child,.meal:first-child{border-top:0}
.meal{display:flex;justify-content:space-between;align-items:center}
.mu{color:var(--mu);font-size:13px}.err{color:#c0392b;font-size:14px;margin-top:8px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hide{display:none}.big{font-size:28px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}td{border-top:1px solid var(--bd);padding:6px 0}td:last-child{text-align:left}
</style>
</head>
<body>
<main>
<h1>מעקב קלוריות 🥗</h1>

<!-- התחברות -->
<div id="auth" class="card hide">
  <h2 id="atitle">התחברות</h2>
  <input id="em" type="email" placeholder="אימייל" autocomplete="email">
  <input id="pw" type="password" placeholder="סיסמה (לפחות 6 תווים)" autocomplete="current-password" style="margin-top:8px">
  <button id="abtn" style="width:100%;margin-top:10px">התחבר</button>
  <button class="x" id="aswitch" style="width:100%">אין לי חשבון, להרשמה</button>
  <div class="err" id="aerr"></div>
</div>

<!-- אפליקציה -->
<div id="app" class="hide">
  <div class="tabs"><button id="t1" class="on">היום</button><button id="t2">פרופיל ו-BMI</button><button id="out" class="x">יציאה</button></div>

  <section id="p1">
    <div class="card">
      <div class="nav"><button class="x" id="prev">→</button><b id="dlabel"></b><button class="x" id="next">←</button></div>
      <div class="row"><span>קלוריות</span><span><b id="calv">0</b> / <span id="calg">0</span></span></div><div class="bar"><i id="calb" style="background:var(--cal)"></i></div>
      <div class="row"><span>חלבון</span><span><b id="prov">0</b> / <span id="prog">0</span> ג׳</span></div><div class="bar"><i id="prob" style="background:var(--pro)"></i></div>
      <div class="row"><span>פחמימות</span><span><b id="carv">0</b> / <span id="carg">0</span> ג׳</span></div><div class="bar"><i id="carb" style="background:var(--car)"></i></div>
      <div class="row"><span>שומן</span><span><b id="fatv">0</b> / <span id="fatg">0</span> ג׳</span></div><div class="bar"><i id="fatb" style="background:var(--fat)"></i></div>
    </div>
    <div class="card">
      <h2>ארוחה חדשה</h2>
      <label class="btn" for="file">📷 צלם / בחר תמונה</label>
      <input type="file" id="file" accept="image/*" style="display:none">
      <img id="pv" alt="">
      <textarea id="note" rows="2" placeholder="תיאור נוסף (אופציונלי): למשל “200 גרם אורז, מטוגן בשמן”" style="margin-top:10px"></textarea>
      <button id="go" style="margin-top:10px;width:100%" disabled>חשב קלוריות</button>
      <div class="err" id="err"></div>
      <div id="res" class="hide">
        <h2 style="margin-top:14px">תוצאה (אפשר לתקן)</h2><div id="items"></div>
        <div class="grid" style="margin-top:10px">
          <div><label>קלוריות</label><input type="number" id="rc"></div><div><label>חלבון (ג׳)</label><input type="number" id="rp"></div>
          <div><label>פחמימות (ג׳)</label><input type="number" id="rcb"></div><div><label>שומן (ג׳)</label><input type="number" id="rf"></div>
        </div>
        <input id="rn" placeholder="שם הארוחה" style="margin-top:8px">
        <button id="add" style="margin-top:10px;width:100%">הוסף ליום</button>
      </div>
    </div>
    <div class="card"><h2>ארוחות היום</h2><div id="meals"></div></div>
  </section>

  <section id="p2" class="hide">
    <div class="card">
      <h2>הנתונים שלך</h2>
      <div class="grid">
        <div><label>מין</label><select id="sex"><option value="m">גבר</option><option value="f">אישה</option></select></div>
        <div><label>גיל</label><input type="number" id="age"></div>
        <div><label>גובה (ס״מ)</label><input type="number" id="h"></div>
        <div><label>משקל (ק״ג)</label><input type="number" id="w" step="0.1"></div>
      </div>
      <label class="mu">רמת פעילות</label>
      <select id="act"><option value="1.2">יושבני (כמעט בלי אימונים)</option><option value="1.375">קלה (1-3 אימונים בשבוע)</option><option value="1.55">בינונית (3-5 אימונים)</option><option value="1.725">גבוהה (6-7 אימונים)</option><option value="1.9">גבוהה מאוד (עבודה פיזית + אימונים)</option></select>
      <label class="mu">מטרה</label>
      <select id="goal"><option value="lose">ירידה במשקל</option><option value="keep">שמירה</option><option value="gain">עלייה במסה</option></select>
      <button id="calc" style="width:100%;margin-top:10px">חשב</button>
    </div>
    <div id="out2" class="card hide">
      <div class="row"><span>BMI</span><span class="big" id="bmi"></span></div><div class="mu" id="bmic"></div>
      <table id="tb" style="margin-top:10px"></table>
      <button id="apply" style="width:100%;margin-top:12px">קבע כיעדים יומיים</button>
      <p class="mu">הערכות כלליות בלבד ולא ייעוץ רפואי. BMI לא מבחין בין שריר לשומן. במצב רפואי או בהריון כדאי להתייעץ עם רופא או תזונאי.</p>
    </div>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== הגדרות: להדביק מ-Supabase (Project Settings > API) =====
const SB_URL = "https://djzzdoxuvkmxmxaomqtr.supabase.co/rest/v1/";
const SB_KEY = "sb_publishable_Js80AbVBPOku2SgOTysd5g_JQ3Xjm-h";
// ==============================================================
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id), r = n => Math.round(+n || 0);
let user = null, session = null, profile = { goals: { c: 2000, p: 120, cb: 220, f: 70 } }, day = new Date(), img = null, signup = false, calcRes = null;
const key = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

// ----- התחברות -----
function showAuth(){ $("auth").classList.remove("hide"); $("app").classList.add("hide"); }
$("aswitch").onclick = () => { signup = !signup; $("atitle").textContent = signup ? "הרשמה" : "התחברות"; $("abtn").textContent = signup ? "הירשם" : "התחבר"; $("aswitch").textContent = signup ? "יש לי חשבון, להתחברות" : "אין לי חשבון, להרשמה"; };
$("abtn").onclick = async () => {
  $("aerr").textContent = "";
  const a = { email: $("em").value.trim(), password: $("pw").value };
  const { error } = signup ? await sb.auth.signUp(a) : await sb.auth.signInWithPassword(a);
  if (error) $("aerr").textContent = error.message;
};
$("out").onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange(async (_e, s) => {
  session = s; user = s ? s.user : null;
  if (!user) return showAuth();
  $("auth").classList.add("hide"); $("app").classList.remove("hide");
  const { data } = await sb.from("profiles").select("data").eq("user_id", user.id).maybeSingle();
  if (data && data.data) profile = Object.assign(profile, data.data);
  fillProfile(); render();
});

// ----- טאבים -----
function tab(n){ $("p1").classList.toggle("hide", n !== 1); $("p2").classList.toggle("hide", n !== 2); $("t1").classList.toggle("on", n === 1); $("t2").classList.toggle("on", n === 2); }
$("t1").onclick = () => tab(1); $("t2").onclick = () => tab(2);

// ----- יום -----
let meals = [];
async function render(){
  const k = key(day);
  const { data } = await sb.from("meals").select("*").eq("user_id", user.id).eq("day", k).order("created_at");
  meals = data || [];
  const t = { c: 0, p: 0, cb: 0, f: 0 }; meals.forEach(m => { t.c += +m.c; t.p += +m.p; t.cb += +m.cb; t.f += +m.f; });
  $("dlabel").textContent = k === key(new Date()) ? "היום" : day.toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
  const g = profile.goals;
  [["cal","c"],["pro","p"],["car","cb"],["fat","f"]].forEach(([id,x]) => { $(id+"v").textContent = r(t[x]); $(id+"g").textContent = g[x]; $(id+"b").style.width = Math.min(100, g[x] ? t[x]/g[x]*100 : 0) + "%"; });
  $("meals").innerHTML = meals.length ? "" : "<div class=mu>עדיין לא נוספו ארוחות.</div>";
  meals.forEach(m => {
    const d = document.createElement("div"); d.className = "meal";
    const s = document.createElement("div"); s.innerHTML = "<b></b><div class=mu></div>";
    s.firstChild.textContent = m.name || "ארוחה";
    s.lastChild.textContent = r(m.c) + " קל׳ · ח׳ " + r(m.p) + " · פ׳ " + r(m.cb) + " · ש׳ " + r(m.f);
    const b = document.createElement("button"); b.className = "x"; b.textContent = "🗑";
    b.onclick = async () => { await sb.from("meals").delete().eq("id", m.id); render(); };
    d.append(s, b); $("meals").append(d);
  });
}
$("prev").onclick = () => { day = new Date(day.getTime() - 864e5); render(); };
$("next").onclick = () => { day = new Date(day.getTime() + 864e5); render(); };

// ----- תמונה וניתוח -----
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return; $("err").textContent = "";
  const im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => { const s = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", .85); img = url.split(",")[1]; $("pv").src = url; $("pv").style.display = "block"; $("go").disabled = false; $("res").classList.add("hide"); };
  im.onerror = () => $("err").textContent = "לא הצלחתי לקרוא את התמונה."; im.src = u;
};
$("go").onclick = async () => {
  $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "מנתח…";
  try {
    const rs = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify({ image: img, mime: "image/jpeg", note: $("note").value }) });
    const j = await rs.json(); if (!rs.ok) throw new Error(j.error || "שגיאה");
    const items = j.items || [], t = { c: 0, p: 0, cb: 0, f: 0 };
    $("items").innerHTML = "";
    items.forEach(i => { t.c += +i.calories || 0; t.p += +i.protein || 0; t.cb += +i.carbs || 0; t.f += +i.fat || 0;
      const d = document.createElement("div"); d.className = "item"; d.textContent = (i.name || "?") + (i.grams ? " (~" + r(i.grams) + " ג׳)" : "") + " — " + r(i.calories) + " קל׳"; $("items").append(d); });
    $("rc").value = r(t.c); $("rp").value = r(t.p); $("rcb").value = r(t.cb); $("rf").value = r(t.f); $("rn").value = j.name || "";
    $("res").classList.remove("hide");
  } catch (e) { $("err").textContent = e.message; }
  $("go").disabled = false; $("go").textContent = "חשב קלוריות";
};
$("add").onclick = async () => {
  const { error } = await sb.from("meals").insert({ user_id: user.id, day: key(day), name: $("rn").value, c: +$("rc").value, p: +$("rp").value, cb: +$("rcb").value, f: +$("rf").value });
  if (error) return $("err").textContent = error.message;
  $("res").classList.add("hide"); $("pv").style.display = "none"; $("note").value = ""; $("file").value = ""; img = null; $("go").disabled = true; render();
};

// ----- פרופיל ו-BMI -----
function fillProfile(){ const b = profile.body; if (!b) return; $("sex").value = b.sex; $("age").value = b.age; $("h").value = b.h; $("w").value = b.w; $("act").value = b.act; $("goal").value = b.goal; }
$("calc").onclick = () => {
  const b = { sex: $("sex").value, age: +$("age").value, h: +$("h").value, w: +$("w").value, act: +$("act").value, goal: $("goal").value };
  if (!b.age || !b.h || !b.w) return alert("מלא גיל, גובה ומשקל");
  const bmi = b.w / Math.pow(b.h / 100, 2);
  const cat = bmi < 18.5 ? "תת משקל" : bmi < 25 ? "טווח תקין" : bmi < 30 ? "עודף משקל" : "השמנה";
  const bmr = 10 * b.w + 6.25 * b.h - 5 * b.age + (b.sex === "m" ? 5 : -161);
  const tdee = bmr * b.act;
  const kcal = r(b.goal === "lose" ? tdee * 0.8 : b.goal === "gain" ? tdee * 1.1 : tdee);
  const pro = r(b.w * 1.8), fat = r(kcal * 0.25 / 9), carb = Math.max(0, r((kcal - pro * 4 - fat * 9) / 4));
  const m = b.sex === "m";
  const rows = [
    ["BMR (קלוריות במנוחה)", r(bmr) + " קל׳"], ["TDEE (שריפה יומית כוללת)", r(tdee) + " קל׳"],
    ["יעד קלוריות", kcal + " קל׳"], ["חלבון", pro + " ג׳"], ["פחמימות", carb + " ג׳"], ["שומן", fat + " ג׳"],
    ["סיבים תזונתיים", r(14 * kcal / 1000) + " ג׳"], ["סוכר מוסף (מקסימום)", r(kcal * 0.1 / 4) + " ג׳"], ["שומן רווי (מקסימום)", r(kcal * 0.1 / 9) + " ג׳"],
    ["נתרן (מקסימום)", "2,300 מ״ג"], ["מים", (b.w * 0.035).toFixed(1) + " ל׳"],
    ["סידן", "1,000 מ״ג"], ["ברזל", m ? "8 מ״ג" : "18 מ״ג (עד גיל 50)"], ["מגנזיום", m ? "400 מ״ג" : "310 מ״ג"], ["אשלגן", m ? "3,400 מ״ג" : "2,600 מ״ג"],
    ["אבץ", m ? "11 מ״ג" : "8 מ״ג"], ["ויטמין C", m ? "90 מ״ג" : "75 מ״ג"], ["ויטמין D", "15 מק״ג"], ["ויטמין B12", "2.4 מק״ג"]
  ];
  $("tb").innerHTML = ""; rows.forEach(([a, v]) => { const tr = document.createElement("tr"); const t1 = document.createElement("td"), t2 = document.createElement("td"); t1.textContent = a; t2.textContent = v; tr.append(t1, t2); $("tb").append(tr); });
  $("bmi").textContent = bmi.toFixed(1); $("bmic").textContent = cat; $("out2").classList.remove("hide");
  calcRes = { body: b, goals: { c: kcal, p: pro, cb: carb, f: fat } };
};
$("apply").onclick = async () => {
  if (!calcRes) return; profile.body = calcRes.body; profile.goals = calcRes.goals;
  const { error } = await sb.from("profiles").upsert({ user_id: user.id, data: profile });
  if (error) return alert(error.message); tab(1); render();
};
</script>
</body>
</html>
